# provider/cloudflare-dns — declarative manifest
# CalVer: 2026-07-22  SemVer: 1.1.0
# Status: TEMPLATE — not yet applied. Contains zero secrets.
# See DNS-Naming-Convention-Decision-Record.md for the Bezos-framed
# decision this manifest implements (Type 2 / two-way door).

zone:
  name: geomesh.net
  # zone_id is environment-specific; resolve at apply time
  zone_id_env_var: CLOUDFLARE_ZONE_ID

dns_records:
  - name_env: DOMAIN_LABEL          # default: tinyverse.dev
    type: CNAME
    content_env: VERCEL_CNAME_TARGET # default: cname.vercel-dns.com
    proxied: false                   # REQUIRED false — Vercel does not support Cloudflare-proxied CNAMEs
    ttl: 300
    comment: "Apex for main branch — canonical tinyverse.dev.geomesh.net"

  - name_env: WILDCARD_LABEL        # default: *.tinyverse.dev
    type: CNAME
    content_env: VERCEL_CNAME_TARGET
    proxied: false
    ttl: 300
    comment: "Wildcard — enables future per-branch preview subdomains"

vercel_domain_binding:
  project_id_env_var: VERCEL_PROJECT_ID
  domain_env: FULL_DOMAIN            # default: tinyverse.dev.geomesh.net
  git_branch_env: GIT_BRANCH         # default: main

cloudflare_access:
  status: not_yet_created
  hostname_env: FULL_DOMAIN
  policies:
    - name: admin-power-tier
      identity_provider: google_workspace
    - name: free-tier
      identity_provider: cloudflare_one_time_pin

required_env_vars_no_defaults:
  - CLOUDFLARE_API_TOKEN
  - CLOUDFLARE_ZONE_ID
  - VERCEL_TOKEN
  - VERCEL_PROJECT_ID

optional_env_vars_with_defaults:
  DOMAIN_LABEL: tinyverse.dev
  WILDCARD_LABEL: "*.tinyverse.dev"
  VERCEL_CNAME_TARGET: cname.vercel-dns.com
  FULL_DOMAIN: tinyverse.dev.geomesh.net
  GIT_BRANCH: main

single_writer_rule: >
  Only one automation agent (human, Claude, or Grok) should apply this
  manifest at a time. Check for existing tinyverse.dev* records before
  writing to avoid duplicate/conflicting CNAMEs.

ssl_limitations: >
  Cloudflare Free Universal SSL covers only geomesh.net and *.geomesh.net.
  It does NOT cover tinyverse.dev.geomesh.net (two labels) or
  *.tinyverse.dev.geomesh.net (three labels). Rely on Vercel-issued
  certificates (proxied:false required). True automatic branch wildcards
  need Advanced Certificate Manager or Vercel nameservers + DNS-01.
